<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Sombrero Seleccionador · Casas del Colegio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
    :root{
        --text: #c9d3e8;
        --text-light: #f4ecd8; /* Tono pergamino */
        --muted: #a89984;
        --gold: #d4af37;

        /* Colores de las casas */
        --pegasus: #f2c33a;
        --pegasus-glow: rgba(242, 195, 58, .65);
        --dragon: #e03131;
        --dragon-glow: rgba(224, 49, 49, .65);
        --centauro: #2f9e44;
        --centauro-glow: rgba(47, 158, 68, .65);
        --kraken: #1c7ed6;
        --kraken-glow: rgba(28, 126, 214, .65);
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }

    body{
        font-family: 'Cinzel', serif;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.25rem 4rem;
        overflow-x: hidden;
        position: relative;
        background-color: #0c0a09;
        /* Fondo simulando el Gran Comedor */
        background-image: 
            radial-gradient(circle at 50% 40%, rgba(45, 35, 25, 0.8) 0%, transparent 60%),
            radial-gradient(circle at 10% 90%, rgba(20, 15, 10, 0.9) 0%, transparent 50%),
            radial-gradient(circle at 90% 90%, rgba(20, 15, 10, 0.9) 0%, transparent 50%),
            url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.08"/></svg>');
    }

    /* Viñeta para oscurecer los bordes */
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        z-index: 0;
    }

    /* ---------- VELAS FLOTANTES ---------- */
    .candles-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .candle {
        position: absolute;
        width: 6px;
        height: 28px;
        background: linear-gradient(to right, #eaddcd, #fdf6e3, #d4c4b0);
        border-radius: 3px;
        box-shadow: inset -1px 0 2px rgba(0,0,0,0.4);
        animation: floatCandle 6s ease-in-out infinite alternate;
    }

    .candle::before {
        content: '';
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 14px;
        background: #ffb703;
        border-radius: 50% 50% 20% 20%;
        box-shadow: 0 0 10px #ffb703, 0 0 20px #fb8500, 0 0 40px rgba(251, 133, 0, 0.6);
        animation: flicker 0.15s infinite alternate;
    }

    @keyframes floatCandle {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-30px); }
    }

    @keyframes flicker {
        0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
        100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
    }

    /* ---------- CABECERA ---------- */
    header{
        position: relative;
        z-index: 1;
        text-align: center;
        margin-bottom: 1.5rem;
        max-width: 800px;
        animation: fadeInDown 1.5s ease-out;
    }

    .header-subtitle {
        font-family: 'MedievalSharp', cursive;
        color: var(--gold);
        font-size: 1rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    h1{
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.4), 0 4px 10px rgba(0,0,0,0.9);
        margin-bottom: 0.5rem;
        line-height: 1.1;
    }

    header p{
        font-family: 'MedievalSharp', cursive;
        color: #d1c3b0;
        font-size: 1.1rem;
        letter-spacing: .05em;
        font-style: italic;
        text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- SELECTOR DE CLASE ---------- */
    .class-selector-container {
        position: relative;
        z-index: 1;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background: rgba(0, 0, 0, 0.6);
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .class-selector-container label {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        color: var(--gold);
        font-size: 1.1rem;
        letter-spacing: 0.1em;
    }

    #classSelect {
        background: #1a1512;
        color: var(--text-light);
        font-family: 'MedievalSharp', cursive;
        font-size: 1.1rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--gold);
        border-radius: 4px;
        cursor: pointer;
        outline: none;
        transition: all 0.3s ease;
    }

    #classSelect:hover, #classSelect:focus {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        border-color: #fce38a;
    }

    #classSelect option {
        background: #1a1512;
        color: var(--text-light);
        font-family: 'Segoe UI', sans-serif;
    }

    /* ---------- LAYOUT ---------- */
    .container{
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
    }

    /* ---------- ESCENARIO DEL SOMBRERO ---------- */
    .hat-area{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        margin-top: 0.5rem;
    }

    .hat-stage{
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #1b2238 0%, #0a0e1a 72%);
        border: 4px solid rgba(140, 160, 200, .22);
        --house-color: #8fa3c8;
        --house-glow: rgba(143, 163, 200, .4);
        transition: border-color .6s ease, box-shadow .6s ease, background .6s ease;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    /* Anillo giratorio de colores alrededor del sombrero */
    .hat-stage::before{
        content: '';
        position: absolute;
        inset: -15px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            var(--pegasus), var(--dragon), var(--centauro), var(--kraken), var(--pegasus));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        opacity: .5;
        animation: spin 14s linear infinite;
        transition: opacity .5s ease;
    }

    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* Estado reposo: respiración suave */
    .hat-stage:not(.sorting):not(.sorted){
        animation: idle-breathe 4.5s ease-in-out infinite;
    }
    @keyframes idle-breathe{
        0%, 100%{ box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(120, 160, 255, .12); }
        50%      { box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 50px rgba(120, 160, 255, .30); }
    }

    /* Estado PENSANDO: el halo recorre los 4 colores */
    .hat-stage.sorting{
        animation: cycle-glow 2s linear infinite;
        background: radial-gradient(circle at 50% 45%, #2a1a10 0%, #0a0604 72%);
    }
    @keyframes cycle-glow{
        0%, 100%{
            border-color: var(--pegasus);
            box-shadow: 0 0 40px var(--pegasus-glow), 0 0 100px var(--pegasus-glow), inset 0 0 30px var(--pegasus-glow);
        }
        25%{
            border-color: var(--dragon);
            box-shadow: 0 0 40px var(--dragon-glow), 0 0 100px var(--dragon-glow), inset 0 0 30px var(--dragon-glow);
        }
        50%{
            border-color: var(--centauro);
            box-shadow: 0 0 40px var(--centauro-glow), 0 0 100px var(--centauro-glow), inset 0 0 30px var(--centauro-glow);
        }
        75%{
            border-color: var(--kraken);
            box-shadow: 0 0 40px var(--kraken-glow), 0 0 100px var(--kraken-glow), inset 0 0 30px var(--kraken-glow);
        }
    }
    .hat-stage.sorting::before{
        opacity: 1;
        animation-duration: 1s;
    }

    /* Estado FINAL: color fijo de la casa */
    .hat-stage.sorted{
        border-color: var(--house-color);
        box-shadow: 0 0 50px var(--house-glow), 0 0 120px var(--house-glow), inset 0 0 40px var(--house-glow);
        background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.6) 0%, #050302 80%);
    }
    .hat-stage.sorted::before{
        opacity: .95;
        animation-duration: 9s;
        background: conic-gradient(from 0deg,
            var(--house-color), transparent 55%, var(--house-color));
    }

    /* El nuevo sombrero SVG */
    .hat-svg {
        width: 170px;
        height: 170px;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8));
        transition: transform .3s ease, filter .3s ease;
        z-index: 2;
    }

    .hat-stage.sorting .hat-svg{
        animation: wobble .4s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 25px var(--house-color)) brightness(1.2);
    }
    
    .hat-stage.sorted .hat-svg {
        filter: drop-shadow(0 0 35px var(--house-color)) brightness(1.1);
    }

    @keyframes wobble{
        from{ transform: rotate(-7deg) scale(1.05) translateY(-5px); }
        to  { transform: rotate(7deg)  scale(1.05) translateY(5px); }
    }

    /* ---------- TEXTO DE ANUNCIO ---------- */
    .announcement{
        font-size: clamp(1.1rem, 2.8vw, 1.5rem);
        font-weight: 700;
        letter-spacing: .05em;
        text-align: center;
        min-height: 2.5rem;
        color: var(--text-light);
        transition: color .4s ease, text-shadow .4s ease;
        text-shadow: 0 2px 15px rgba(0, 0, 0, .9);
    }

    .dots{ display: inline-block; width: 1.4em; text-align: left; }
    .dots::after{
        content: '';
        animation: dots 1.4s steps(1) infinite;
    }
    @keyframes dots{
        0%  { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
    }

    /* ---------- TARJETAS DE ALUMNOS ---------- */
    .student-grid{
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 1.2rem;
        width: 100%;
    }

    .student-card{
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .75rem;
        padding: 1.3rem 1rem;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(160deg, #231b15 0%, #110c08 100%);
        border: 1px solid rgba(212, 175, 55, 0.15);
        box-shadow: 0 8px 20px rgba(0, 0, 0, .6);
        transition: transform .3s cubic-bezier(.25, .8, .25, 1),
                    border-color .3s ease,
                    box-shadow .3s ease;
        animation: card-in .6s cubic-bezier(.2, .8, .25, 1) backwards;
        animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes card-in{
        from{ opacity: 0; transform: translateY(30px) scale(.9); }
        to  { opacity: 1; transform: none; }
    }

    /* Destello que barre la tarjeta al pasar el ratón */
    .student-card::after{
        content: '';
        position: absolute;
        top: 0;
        left: -70%;
        width: 50%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(212, 175, 55, .15), transparent);
        transform: skewX(-18deg);
        transition: left .6s ease;
        pointer-events: none;
    }
    .student-card:not(.sorted):hover::after{ left: 130%; }

    .student-card:not(.sorted):hover{
        transform: translateY(-6px);
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 12px 25px rgba(0, 0, 0, .7), 0 0 20px rgba(212, 175, 55, .15);
    }

    .student-avatar{
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.8rem;
        background: rgba(0, 0, 0, .4);
        border: 2px solid rgba(212, 175, 55, .2);
        transition: all .45s cubic-bezier(.175, .885, .32, 1.275);
    }

    .student-name{
        font-family: 'MedievalSharp', cursive;
        color: var(--text-light);
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        line-height: 1.2;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .house-badge{
        margin-top: auto;
        padding: .35rem .8rem;
        border-radius: 4px;
        font-size: .7rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: .1em;
        background: rgba(0, 0, 0, .5);
        color: var(--muted);
        border: 1px solid rgba(255, 255, 255, .05);
        opacity: 0;
        transform: scale(.8) translateY(8px);
        transition: all .5s cubic-bezier(.175, .885, .32, 1.275);
    }

    /* --- Tarjeta ya asignada --- */
    .student-card.sorted{
        cursor: default;
        border-color: var(--house-color);
        box-shadow: 0 0 25px var(--house-glow), inset 0 0 40px -10px var(--house-color);
        background: linear-gradient(160deg, #1a1512 0%, #0a0604 100%);
    }
    .student-card.sorted .student-avatar{
        border-color: var(--house-color);
        box-shadow: 0 0 20px var(--house-glow), inset 0 0 20px var(--house-glow);
        transform: scale(1.08);
    }
    .student-card.sorted .house-badge{
        opacity: 1;
        transform: scale(1) translateY(0);
        background: var(--house-color);
        color: var(--house-text, #fff);
        border-color: transparent;
        box-shadow: 0 0 15px var(--house-glow);
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* ---------- BOTÓN REINICIAR ---------- */
    .reset-btn{
        background: rgba(212, 175, 55, .05);
        border: 1px solid rgba(212, 175, 55, .4);
        color: var(--gold);
        padding: .8rem 1.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: 'Cinzel', serif;
        font-size: .9rem;
        font-weight: 700;
        letter-spacing: .1em;
        transition: all .3s ease;
        text-transform: uppercase;
        margin-top: 1rem;
    }
    .reset-btn:hover{
        background: rgba(212, 175, 55, .15);
        border-color: var(--gold);
        color: #fff;
        box-shadow: 0 0 20px rgba(212, 175, 55, .4);
        transform: translateY(-2px);
    }

    /* ---------- DESTELLO PANTALLA COMPLETA ---------- */
    .flash-overlay{
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        opacity: 0;
    }
    .flash-overlay.active{ animation: flash-burst .85s ease-out forwards; }
    @keyframes flash-burst{
        0%  { opacity: .6; }
        100%{ opacity: 0; }
    }

    /* ---------- PARTÍCULAS DEL ESTALLIDO ---------- */
    .particle{
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1000;
        transform: translate(-50%, -50%);
        animation: pop 1.2s cubic-bezier(.15, .7, .3, 1) forwards;
    }
    @keyframes pop{
        0%{
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
        }
        100%{
            opacity: 0;
            transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.1);
        }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px){
        .hat-stage{ width: 200px; height: 200px; }
        .hat-svg{ width: 130px; height: 130px; }
        .student-grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        h1 { font-size: 2rem; }
        .class-selector-container { flex-direction: column; gap: 0.5rem; padding: 1rem; }
    }
</style>
</head>

/* =========================================================
   2. PROCESAMIENTO DEL CSV Y CONFIGURACIÓN
   ========================================================= */
const HOUSES = {
    pegasus:  { name: 'Pegasus',  color: '#f2c33a', glow: 'rgba(242,195,58,.55)',  text: '#241a00' },
    dragon:   { name: 'Dragon',   color: '#e03131', glow: 'rgba(224,49,49,.55)',   text: '#ffffff' },
    centauro: { name: 'Centauro', color: '#2f9e44', glow: 'rgba(47,158,68,.55)',   text: '#ffffff' },
    kraken:   { name: 'Kraken',   color: '#1c7ed6', glow: 'rgba(28,126,214,.55)',  text: '#ffffff' }
};

const ICONS = {
    dragon: '🐉',
    centauro: '🏹',
    pegasus: '🕊️',
    kraken: '🐙'
};

// Parsear el CSV
let studentsData = [];
const lines = csvData.trim().split('\n');
for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    // Expresión regular para separar por comas, respetando las comillas
    const matches = line.match(/(?:[^,"]+|"[^"]*")+/g);
    if (matches && matches.length >= 3) {
        const house = matches[0].toLowerCase().trim();
        const name = matches[1].replace(/"/g, '').trim();
        const className = matches[2].trim();
        
        studentsData.push({
            id: i,
            name: name,
            house: house,
            class: className,
            icon: ICONS[house] || '🧙',
            sorted: false
        });
    }
}

// Extraer clases únicas y ordenarlas
const uniqueClasses = [...new Set(studentsData.map(s => s.class))].sort();

/* =========================================================
   3. REFERENCIAS DEL DOM
   ========================================================= */
const studentGrid   = document.getElementById('studentGrid');
const hatStage      = document.getElementById('hatStage');
const announcement  = document.getElementById('announcement');
const flashOverlay  = document.getElementById('flashOverlay');
const resetBtn      = document.getElementById('resetBtn');
const candlesLayer  = document.getElementById('candlesLayer');
const classSelect   = document.getElementById('classSelect');

let isSorting = false;

/* =========================================================
   4. FONDO: VELAS FLOTANTES
   ========================================================= */
(function createCandles(){
    const numCandles = 25;
    for (let i = 0; i < numCandles; i++){
        const candle = document.createElement('div');
        candle.className = 'candle';
        candle.style.left = Math.random() * 100 + 'vw';
        candle.style.top = (10 + Math.random() * 80) + 'vh';
        const duration = 4 + Math.random() * 4;
        const delay = Math.random() * -6;
        candle.style.animationDuration = duration + 's';
        candle.style.animationDelay = delay + 's';
        const scale = 0.6 + Math.random() * 0.8;
        candle.style.transform = `scale(${scale})`;
        candlesLayer.appendChild(candle);
    }
})();

/* =========================================================
   5. POBLAR SELECTOR DE CLASES
   ========================================================= */
uniqueClasses.forEach(cls => {
    const option = document.createElement('option');
    option.value = cls;
    option.textContent = cls;
    classSelect.appendChild(option);
});

/* =========================================================
   6. RENDERIZADO DE LAS TARJETAS (FILTRADO)
   ========================================================= */
function renderStudents(){
    studentGrid.innerHTML = '';
    const selectedClass = classSelect.value;
    
    // Filtrar alumnos por la clase seleccionada
    const filteredStudents = studentsData.filter(s => s.class === selectedClass);

    filteredStudents.forEach((student, index) => {
        const card = document.createElement('div');
        card.className = 'student-card';
        if (student.sorted) {
            card.classList.add('sorted');
            const house = HOUSES[student.house];
            card.style.setProperty('--house-color', house.color);
            card.style.setProperty('--house-glow',  house.glow);
            card.style.setProperty('--house-text',  house.text);
        }
        
        card.style.setProperty('--i', index);
        card.innerHTML = `
            <div class="student-avatar">${student.icon}</div>
            <div class="student-name">${student.name}</div>
            <div class="house-badge">${student.sorted ? HOUSES[student.house].name : 'Sin asignar'}</div>
        `;
        
        card.addEventListener('click', () => triggerSorting(student, card));
        studentGrid.appendChild(card);
    });
}

/* =========================================================
   7. LA CEREMONIA
   ========================================================= */
function triggerSorting(student, card){
    if (isSorting) return;
    if (student.sorted) return;

    isSorting = true;
    const house = HOUSES[student.house];

    // --- Fase 1: el sombrero piensa ---
    hatStage.classList.remove('sorted');
    hatStage.classList.add('sorting');

    announcement.innerHTML =
        `El Sombrero está decidiendo el destino de <strong>${student.name}</strong><span class="dots"></span>`;

    // --- Fase 2: revelación ---
    setTimeout(() => {
        student.sorted = true; // Guardar estado

        // El sombrero se queda con el color de la casa
        hatStage.classList.remove('sorting');
        hatStage.style.setProperty('--house-color', house.color);
        hatStage.style.setProperty('--house-glow',  house.glow);
        hatStage.classList.add('sorted');

        announcement.innerHTML =
            `<strong style="color:${house.color}">${student.name}</strong>` +
            ` pertenece a <strong style="color:${house.color}">${house.name}</strong>`;

        // Destello de pantalla
        flashOverlay.style.background = house.color;
        flashOverlay.classList.add('active');
        setTimeout(() => flashOverlay.classList.remove('active'), 900);

        // Estallido de partículas
        burstParticles(house.color);

        // La tarjeta se marca con los colores de la casa
        card.style.setProperty('--house-color', house.color);
        card.style.setProperty('--house-glow',  house.glow);
        card.style.setProperty('--house-text',  house.text);
        card.classList.add('sorted');
        card.querySelector('.house-badge').textContent = house.name;

        isSorting = false;
    }, 2600);
}

/* =========================================================
   8. PARTÍCULAS
   ========================================================= */
function burstParticles(color){
    const rect = hatStage.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    for (let i = 0; i < 40; i++){
        const p = document.createElement('div');
        p.className = 'particle';

        const angle = Math.random() * Math.PI * 2;
        const dist  = 120 + Math.random() * 250;
        const size  = 4 + Math.random() * 8;

        p.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--y', Math.sin(angle) * dist + 'px');
        p.style.left   = cx + 'px';
        p.style.top    = cy + 'px';
        p.style.width  = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.color      = color;
        p.style.boxShadow  = `0 0 15px ${color}`;
        p.style.animationDelay = (Math.random() * 0.15) + 's';

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
    }
}

/* =========================================================
   9. EVENTOS Y ARRANQUE
   ========================================================= */
classSelect.addEventListener('change', renderStudents);

resetBtn.addEventListener('click', () => {
    if (isSorting) return;
    const selectedClass = classSelect.value;
    
    // Reiniciar solo los alumnos de la clase actual
    studentsData.forEach(s => {
        if (s.class === selectedClass) {
            s.sorted = false;
        }
    });

    hatStage.classList.remove('sorted');
    hatStage.style.removeProperty('--house-color');
    hatStage.style.removeProperty('--house-glow');

    announcement.innerHTML = 'Esperando a un alumno<span class="dots"></span>';
    renderStudents();
});

// Inicializar
renderStudents();
</script>
