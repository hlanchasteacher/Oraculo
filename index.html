<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Sombrero Seleccionador · Casas del Colegio</title>
<style>
    :root{
        --text: #c9d3e8;
        --text-light: #ffffff;
        --muted: #8b97b5;

        /* Colores de las casas */
        --pegasus: #f2c33a;
        --pegasus-glow: rgba(242, 195, 58, .55);
        --dragon: #e03131;
        --dragon-glow: rgba(224, 49, 49, .55);
        --centauro: #2f9e44;
        --centauro-glow: rgba(47, 158, 68, .55);
        --kraken: #1c7ed6;
        --kraken-glow: rgba(28, 126, 214, .55);
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }

    body{
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1.25rem 4rem;
        overflow-x: hidden;
        position: relative;
        background:
            radial-gradient(1200px 600px at 50% -10%, #16203a 0%, transparent 70%),
            radial-gradient(800px 500px at 90% 110%, #101a30 0%, transparent 70%),
            linear-gradient(180deg, #070a14 0%, #04060d 100%);
    }

    /* ---------- FONDO ANIMADO ---------- */
    .aurora{
        position: fixed;
        inset: -25%;
        z-index: 0;
        pointer-events: none;
        filter: blur(90px);
        opacity: .35;
    }
    .aurora span{
        position: absolute;
        width: 42vmax;
        height: 42vmax;
        border-radius: 50%;
        mix-blend-mode: screen;
    }
    .aurora span:nth-child(1){ background: var(--pegasus);  top: -12%; left: -8%;  animation: drift1 22s ease-in-out infinite alternate; }
    .aurora span:nth-child(2){ background: var(--dragon);   top: -16%; right: -10%; animation: drift2 26s ease-in-out infinite alternate; }
    .aurora span:nth-child(3){ background: var(--centauro); bottom: -18%; left: -6%; animation: drift3 24s ease-in-out infinite alternate; }
    .aurora span:nth-child(4){ background: var(--kraken);   bottom: -20%; right: -8%; animation: drift4 20s ease-in-out infinite alternate; }

    @keyframes drift1{ to{ transform: translate3d(14vw, 10vh, 0) scale(1.25); } }
    @keyframes drift2{ to{ transform: translate3d(-16vw, 12vh, 0) scale(1.15); } }
    @keyframes drift3{ to{ transform: translate3d(12vw, -14vh, 0) scale(1.2); } }
    @keyframes drift4{ to{ transform: translate3d(-14vw, -10vh, 0) scale(1.3); } }

    .stars{
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .stars span{
        position: absolute;
        background: #ffffff;
        border-radius: 50%;
        animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle{
        0%, 100%{ opacity: .12; transform: scale(.7); }
        50%      { opacity: .95; transform: scale(1.35); }
    }

    /* ---------- CABECERA ---------- */
    header{
        position: relative;
        z-index: 1;
        text-align: center;
        margin-bottom: 2.5rem;
        max-width: 760px;
    }

    h1{
        font-size: clamp(1.8rem, 4.5vw, 2.9rem);
        letter-spacing: .06em;
        text-transform: uppercase;
        background: linear-gradient(90deg,
            var(--pegasus), var(--dragon), var(--centauro), var(--kraken), var(--pegasus));
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 9s linear infinite;
        margin-bottom: .6rem;
    }
    @keyframes shimmer{ to{ background-position: 300% 0; } }

    header p{
        color: var(--muted);
        font-size: .98rem;
        letter-spacing: .03em;
    }

    /* ---------- LAYOUT ---------- */
    .container{
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1050px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
    }

    /* ---------- ESCENARIO DEL SOMBRERO ---------- */
    .hat-area{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.8rem;
    }

    .hat-stage{
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #1b2238 0%, #0a0e1a 72%);
        border: 4px solid rgba(140, 160, 200, .22);
        --house-color: #8fa3c8;
        --house-glow: rgba(143, 163, 200, .4);
        transition: border-color .6s ease, box-shadow .6s ease;
    }

    /* Anillo giratorio de colores alrededor del sombrero */
    .hat-stage::before{
        content: '';
        position: absolute;
        inset: -15px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            var(--pegasus), var(--dragon), var(--centauro), var(--kraken), var(--pegasus));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        opacity: .5;
        animation: spin 14s linear infinite;
        transition: opacity .5s ease;
    }

    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* Estado reposo: respiración suave */
    .hat-stage:not(.sorting):not(.sorted){
        animation: idle-breathe 4.5s ease-in-out infinite;
    }
    @keyframes idle-breathe{
        0%, 100%{ box-shadow: 0 0 25px rgba(120, 160, 255, .12); }
        50%      { box-shadow: 0 0 50px rgba(120, 160, 255, .30); }
    }

    /* Estado PENSANDO: el halo recorre los 4 colores */
    .hat-stage.sorting{
        animation: cycle-glow 2.4s linear infinite;
    }
    @keyframes cycle-glow{
        0%, 100%{
            border-color: var(--pegasus);
            box-shadow: 0 0 40px var(--pegasus-glow), 0 0 95px var(--pegasus-glow);
        }
        25%{
            border-color: var(--dragon);
            box-shadow: 0 0 40px var(--dragon-glow), 0 0 95px var(--dragon-glow);
        }
        50%{
            border-color: var(--centauro);
            box-shadow: 0 0 40px var(--centauro-glow), 0 0 95px var(--centauro-glow);
        }
        75%{
            border-color: var(--kraken);
            box-shadow: 0 0 40px var(--kraken-glow), 0 0 95px var(--kraken-glow);
        }
    }
    .hat-stage.sorting::before{
        opacity: 1;
        animation-duration: 1.2s;
    }

    /* Estado FINAL: color fijo de la casa */
    .hat-stage.sorted{
        border-color: var(--house-color);
        box-shadow: 0 0 50px var(--house-glow), 0 0 120px var(--house-glow);
    }
    .hat-stage.sorted::before{
        opacity: .95;
        animation-duration: 9s;
        background: conic-gradient(from 0deg,
            var(--house-color), transparent 55%, var(--house-color));
    }

    .hat-icon{
        font-size: 6rem;
        line-height: 1;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .6));
        transition: transform .3s ease;
        user-select: none;
    }
    .hat-stage.sorting .hat-icon{
        animation: wobble .45s ease-in-out infinite alternate;
    }
    @keyframes wobble{
        from{ transform: rotate(-9deg) scale(1.07); }
        to  { transform: rotate(9deg)  scale(1.07); }
    }

    /* ---------- TEXTO DE ANUNCIO ---------- */
    .announcement{
        font-size: clamp(1.05rem, 2.6vw, 1.35rem);
        font-weight: 600;
        letter-spacing: .02em;
        text-align: center;
        min-height: 2.4rem;
        color: var(--text-light);
        transition: color .4s ease;
        text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
    }

    .dots{ display: inline-block; width: 1.4em; text-align: left; }
    .dots::after{
        content: '';
        animation: dots 1.4s steps(1) infinite;
    }
    @keyframes dots{
        0%  { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
    }

    /* ---------- TARJETAS DE ALUMNOS ---------- */
    .student-grid{
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 1.3rem;
        width: 100%;
    }

    .student-card{
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .75rem;
        padding: 1.5rem 1rem;
        border-radius: 18px;
        cursor: pointer;
        background: linear-gradient(160deg, #161d33 0%, #0c1120 100%);
        border: 1px solid rgba(120, 140, 180, .18);
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
        transition: transform .3s cubic-bezier(.25, .8, .25, 1),
                    border-color .3s ease,
                    box-shadow .3s ease;
        animation: card-in .6s cubic-bezier(.2, .8, .25, 1) backwards;
        animation-delay: calc(var(--i) * 70ms);
    }

    @keyframes card-in{
        from{ opacity: 0; transform: translateY(26px) scale(.94); }
        to  { opacity: 1; transform: none; }
    }

    /* Destello que barre la tarjeta al pasar el ratón */
    .student-card::after{
        content: '';
        position: absolute;
        top: 0;
        left: -70%;
        width: 50%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
        transform: skewX(-18deg);
        transition: left .6s ease;
        pointer-events: none;
    }
    .student-card:not(.sorted):hover::after{ left: 130%; }

    .student-card:not(.sorted):hover{
        transform: translateY(-7px);
        border-color: rgba(180, 200, 240, .55);
        box-shadow: 0 14px 30px rgba(0, 0, 0, .5), 0 0 22px rgba(140, 180, 255, .18);
    }

    .student-avatar{
        width: 66px;
        height: 66px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.9rem;
        background: rgba(255, 255, 255, .05);
        border: 2px solid rgba(255, 255, 255, .08);
        transition: all .45s cubic-bezier(.175, .885, .32, 1.275);
    }

    .student-name{
        color: var(--text-light);
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        line-height: 1.25;
    }

    .house-badge{
        margin-top: auto;
        padding: .34rem .95rem;
        border-radius: 999px;
        font-size: .7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .13em;
        background: rgba(255, 255, 255, .06);
        color: var(--muted);
        border: 1px solid rgba(255, 255, 255, .07);
        opacity: 0;
        transform: scale(.6) translateY(8px);
        transition: all .5s cubic-bezier(.175, .885, .32, 1.275);
    }

    /* --- Tarjeta ya asignada --- */
    .student-card.sorted{
        cursor: default;
        border-color: var(--house-color);
        box-shadow: 0 0 24px var(--house-glow), inset 0 0 34px -14px var(--house-color);
    }
    .student-card.sorted .student-avatar{
        border-color: var(--house-color);
        box-shadow: 0 0 20px var(--house-glow), inset 0 0 20px var(--house-glow);
        transform: scale(1.06);
    }
    .student-card.sorted .house-badge{
        opacity: 1;
        transform: scale(1) translateY(0);
        background: var(--house-color);
        color: var(--house-text, #fff);
        border-color: transparent;
        box-shadow: 0 0 18px var(--house-glow);
    }

    /* ---------- BOTÓN REINICIAR ---------- */
    .reset-btn{
        background: rgba(255, 255, 255, .04);
        border: 1px solid rgba(150, 170, 220, .25);
        color: var(--text);
        padding: .75rem 1.6rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: .9rem;
        letter-spacing: .05em;
        font-family: inherit;
        transition: all .25s ease;
    }
    .reset-btn:hover{
        background: rgba(255, 255, 255, .1);
        border-color: rgba(200, 220, 255, .55);
        color: #fff;
        transform: translateY(-2px);
    }

    /* ---------- DESTELLO PANTALLA COMPLETA ---------- */
    .flash-overlay{
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        opacity: 0;
    }
    .flash-overlay.active{ animation: flash-burst .85s ease-out forwards; }
    @keyframes flash-burst{
        0%  { opacity: .75; }
        100%{ opacity: 0; }
    }

    /* ---------- PARTÍCULAS DEL ESTALLIDO ---------- */
    .particle{
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1000;
        transform: translate(-50%, -50%);
        animation: pop 1.1s cubic-bezier(.15, .7, .3, 1) forwards;
    }
    @keyframes pop{
        0%{
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        100%{
            opacity: 0;
            transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.15);
        }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px){
        .hat-stage{ width: 200px; height: 200px; }
        .hat-icon{ font-size: 4.6rem; }
        .student-grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    }
</style>
</head>
<body>

    <!-- Fondo animado -->
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <!-- Destello de la casa -->
    <div class="flash-overlay" id="flashOverlay" aria-hidden="true"></div>

    <header>
        <h1>El Sombrero Seleccionador</h1>
        <p>Haz clic en un alumno para descubrir a qué casa pertenece</p>
    </header>

    <main class="container">

        <div class="hat-area">
            <div class="hat-stage" id="hatStage">
                <div class="hat-icon" id="hatIcon">🎩</div>
            </div>
            <div class="announcement" id="announcement">
                Esperando a un alumno<span class="dots"></span>
            </div>
        </div>

        <div class="student-grid" id="studentGrid"></div>

        <button class="reset-btn" id="resetBtn">↺ Reiniciar ceremonia</button>

    </main>

<script>
/* =========================================================
   1. CONFIGURACIÓN DE LAS CASAS
   ========================================================= */
const HOUSES = {
    pegasus:  { name: 'Pegasus',  color: '#f2c33a', glow: 'rgba(242,195,58,.55)',  text: '#241a00' },
    dragon:   { name: 'Dragon',   color: '#e03131', glow: 'rgba(224,49,49,.55)',   text: '#ffffff' },
    centauro: { name: 'Centauro', color: '#2f9e44', glow: 'rgba(47,158,68,.55)',   text: '#ffffff' },
    kraken:   { name: 'Kraken',   color: '#1c7ed6', glow: 'rgba(28,126,214,.55)',  text: '#ffffff' }
};

/* =========================================================
   2. LISTADO DE ALUMNOS  ← EDITA AQUÍ
   ---------------------------------------------------------
   name  : nombre del alumno
   house : 'pegasus' | 'dragon' | 'centauro' | 'kraken'
   icon  : emoji del avatar
   ========================================================= */
const studentsData = [
    { id: 1,  name: 'Lucía Fernández', house: 'pegasus',  icon: '🕊️' },
    { id: 2,  name: 'Marcos Ruiz',     house: 'dragon',   icon: '🐉' },
    { id: 3,  name: 'Elena Sotelo',    house: 'centauro', icon: '🏹' },
    { id: 4,  name: 'Iván Peralta',    house: 'kraken',   icon: '🐙' },
    { id: 5,  name: 'Sofía Marín',     house: 'pegasus',  icon: '⭐' },
    { id: 6,  name: 'Diego Navarro',   house: 'dragon',   icon: '🔥' },
    { id: 7,  name: 'Valeria Cruz',    house: 'centauro', icon: '🌿' },
    { id: 8,  name: 'Hugo Beltrán',    house: 'kraken',   icon: '🌊' },
    { id: 9,  name: 'Carmen Vidal',    house: 'pegasus',  icon: '🌙' },
    { id: 10, name: 'Álvaro Ríos',     house: 'dragon',   icon: '⚔️' },
    { id: 11, name: 'Nerea Campos',    house: 'centauro', icon: '🛡️' },
    { id: 12, name: 'Pablo Iglesias',  house: 'kraken',   icon: '🧭' }
];

/* =========================================================
   3. REFERENCIAS DEL DOM
   ========================================================= */
const studentGrid  = document.getElementById('studentGrid');
const hatStage     = document.getElementById('hatStage');
const hatIcon      = document.getElementById('hatIcon');
const announcement = document.getElementById('announcement');
const flashOverlay = document.getElementById('flashOverlay');
const resetBtn     = document.getElementById('resetBtn');
const starsLayer   = document.getElementById('stars');

let isSorting = false;

/* =========================================================
   4. FONDO: ESTRELLAS
   ========================================================= */
(function createStars(){
    for (let i = 0; i < 80; i++){
        const star = document.createElement('span');
        const size = Math.random() * 2 + 1;
        star.style.width  = size + 'px';
        star.style.height = size + 'px';
        star.style.left   = Math.random() * 100 + '%';
        star.style.top    = Math.random() * 100 + '%';
        star.style.animationDelay    = (Math.random() * 6).toFixed(2) + 's';
        star.style.animationDuration = (3 + Math.random() * 4).toFixed(2) + 's';
        starsLayer.appendChild(star);
    }
})();

/* =========================================================
   5. RENDERIZADO DE LAS TARJETAS
   ========================================================= */
function renderStudents(){
    studentGrid.innerHTML = '';

    studentsData.forEach((student, index) => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.style.setProperty('--i', index);
        card.innerHTML = `
            <div class="student-avatar">${student.icon}</div>
            <div class="student-name">${student.name}</div>
            <div class="house-badge">Sin asignar</div>
        `;
        card.addEventListener('click', () => triggerSorting(student, card));
        studentGrid.appendChild(card);
    });
}

/* =========================================================
   6. LA CEREMONIA
   ========================================================= */
function triggerSorting(student, card){
    if (isSorting) return;
    if (card.classList.contains('sorted')) return;

    isSorting = true;
    const house = HOUSES[student.house];

    // --- Fase 1: el sombrero piensa ---
    hatStage.classList.remove('sorted');
    hatStage.classList.add('sorting');
    hatIcon.textContent = '🧙';

    announcement.innerHTML =
        `El Sombrero está decidiendo el destino de <strong>${student.name}</strong><span class="dots"></span>`;

    // --- Fase 2: revelación ---
    setTimeout(() => {

        // El sombrero se queda con el color de la casa
        hatStage.classList.remove('sorting');
        hatStage.style.setProperty('--house-color', house.color);
        hatStage.style.setProperty('--house-glow',  house.glow);
        hatStage.classList.add('sorted');

        hatIcon.textContent = '🎩';

        announcement.innerHTML =
            `<strong style="color:${house.color}">${student.name}</strong>` +
            ` pertenece a <strong style="color:${house.color}">${house.name}</strong>`;

        // Destello de pantalla
        flashOverlay.style.background = house.color;
        flashOverlay.classList.add('active');
        setTimeout(() => flashOverlay.classList.remove('active'), 900);

        // Estallido de partículas
        burstParticles(house.color);

        // La tarjeta se marca con los colores de la casa
        card.style.setProperty('--house-color', house.color);
        card.style.setProperty('--house-glow',  house.glow);
        card.style.setProperty('--house-text',  house.text);
        card.classList.add('sorted');
        card.querySelector('.house-badge').textContent = house.name;

        isSorting = false;

    }, 2600);
}

/* =========================================================
   7. PARTÍCULAS
   ========================================================= */
function burstParticles(color){
    const rect = hatStage.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    for (let i = 0; i < 34; i++){
        const p = document.createElement('div');
        p.className = 'particle';

        const angle = Math.random() * Math.PI * 2;
        const dist  = 110 + Math.random() * 220;
        const size  = 4 + Math.random() * 8;

        p.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--y', Math.sin(angle) * dist + 'px');
        p.style.left   = cx + 'px';
        p.style.top    = cy + 'px';
        p.style.width  = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.color      = color;
        p.style.boxShadow  = `0 0 12px ${color}`;
        p.style.animationDelay = (Math.random() * 0.12) + 's';

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1400);
    }
}

/* =========================================================
   8. REINICIAR
   ========================================================= */
resetBtn.addEventListener('click', () => {
    if (isSorting) return;

    hatStage.classList.remove('sorted');
    hatStage.style.removeProperty('--house-color');
    hatStage.style.removeProperty('--house-glow');
    hatIcon.textContent = '🎩';

    announcement.innerHTML = 'Esperando a un alumno<span class="dots"></span>';

    renderStudents();
});

/* =========================================================
   9. ARRANQUE
   ========================================================= */
renderStudents();
</script>
</body>
</html>
